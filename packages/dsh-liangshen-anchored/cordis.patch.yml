# Three independently switchable preset rows: each row mounts the same host
# plugin with one preset selected. The plugin manager shows three components
# and toggles them per row; `statusMode: merge` keeps the diagnostic file whole.
- insert:
    - id: preset-liangshen
      name: '@mosire/dsh-liangshen-anchored'
      config:
        statusMode: merge
        presets:
          liangshen: true
          emptySystem: false
          promptLab: false
    - id: preset-liangshen-empty-system
      name: '@mosire/dsh-liangshen-anchored'
      config:
        statusMode: merge
        presets:
          liangshen: false
          emptySystem: true
          promptLab: false
    - id: preset-minimal-prompt-lab
      name: '@mosire/dsh-liangshen-anchored'
      config:
        statusMode: merge
        presets:
          liangshen: false
          emptySystem: false
          promptLab: true
